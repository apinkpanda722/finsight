# 프로젝트 레벨 Codex hook 설정. 실제 hook 스크립트는 `scripts/hooks/`에 공통으로 있고
# (Claude Code용 `.claude/settings.json`도 동일 스크립트를 가리킨다), 여기서는 Codex의
# PreToolUse/Stop 이벤트에 그 스크립트들을 등록만 한다.

[[hooks.PreToolUse]]
matcher = "Bash"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'bash "$(git rev-parse --show-toplevel)/scripts/hooks/dangerous-command-guard.sh"'
timeout = 5
statusMessage = "위험한 명령어 검사 중"

[[hooks.PreToolUse]]
matcher = "apply_patch"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'bash "$(git rev-parse --show-toplevel)/scripts/hooks/tdd-guard-codex.sh"'
timeout = 5
statusMessage = "TDD 정책 검사 중"

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = 'bash "$(git rev-parse --show-toplevel)/scripts/hooks/verify-before-stop.sh"'
timeout = 300
statusMessage = "lint/build/test 실행 중"

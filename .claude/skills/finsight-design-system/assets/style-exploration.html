<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="design_doc_mode" content="canvas">
<title>finsight — 스타일 탐색</title>
<link rel="stylesheet" href="_ds/finsight-design-system-c404e7e2-ae62-406a-8447-339f79ac12e2/tokens/fonts.css">
<link rel="stylesheet" href="_ds/finsight-design-system-c404e7e2-ae62-406a-8447-339f79ac12e2/tokens/colors.css">
<link rel="stylesheet" href="_ds/finsight-design-system-c404e7e2-ae62-406a-8447-339f79ac12e2/tokens/typography.css">
<link rel="stylesheet" href="_ds/finsight-design-system-c404e7e2-ae62-406a-8447-339f79ac12e2/tokens/radius.css">
<script src="app/mock-data.js"></script>
<script src="app/charts.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-body);color:var(--color-ink)}
.label{position:absolute;font:600 13px/1.4 var(--font-body);color:#666}
.frame-inner{width:100%;height:100%;overflow:hidden;border-radius:12px;border:1px solid #ddd;box-shadow:0 4px 20px rgba(0,0,0,0.08)}
.light{background:var(--color-canvas)}
.dark{background:var(--color-surface-dark);color:var(--color-on-dark)}
.lnav{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;flex-shrink:0}
.wordmark{font:600 18px var(--font-display)}
.navlinks{display:flex;gap:28px;font:var(--text-nav-link);color:var(--color-muted)}
.dark .navlinks{color:var(--color-on-dark-soft)}
.navcta{display:flex;align-items:center;gap:14px;font:var(--text-nav-link)}
.navlink-plain{color:var(--color-muted);cursor:default}
.dark .navlink-plain{color:var(--color-on-dark-soft)}
.pill-btn-primary{background:var(--color-primary);color:#fff;border:none;border-radius:var(--radius-pill);padding:12px 22px;font:var(--text-button);cursor:pointer}
.pill-btn-primary.lg{padding:16px 32px;font-size:18px}
.pill-btn-outline-light{background:transparent;color:var(--color-ink);border:1px solid var(--color-hairline);border-radius:var(--radius-pill);padding:12px 22px;font:var(--text-button);cursor:pointer}
.pill-btn-outline-dark{background:transparent;color:#fff;border:1px solid rgba(255,255,255,0.4);border-radius:var(--radius-pill);padding:12px 22px;font:var(--text-button);cursor:pointer}
.pill-btn-outline-dark.lg{padding:16px 32px;font-size:18px}
.badge-pill{display:inline-block;background:var(--color-surface-strong);color:var(--color-ink);font:600 12px/1.5 var(--font-body);text-transform:uppercase;letter-spacing:.03em;border-radius:var(--radius-pill);padding:6px 14px}
.badge-pill.dark{background:rgba(255,255,255,0.1);color:#fff}
.badge-pill.mono{background:rgba(28,78,216,0.18);color:#7fa2ff;font-family:var(--font-mono)}
.card{border-radius:var(--radius-xl);padding:24px}
.chart-card{background:var(--color-canvas);border:1px solid var(--color-hairline)}
.dark-card{background:var(--color-surface-dark-elevated);border:none;box-shadow:0 20px 60px rgba(0,0,0,0.4)}
.card-label{font:var(--text-caption);color:var(--color-muted);margin-bottom:6px}
.dark-card .card-label{color:var(--color-on-dark-soft)}
.card-total{font:var(--text-display-sm)}
.trust-hero .chart-card{width:100%;padding:28px}
.trust-hero .card-total{font-size:28px}
.mono-num{font-family:var(--font-mono)}

/* TRUST landing */
.trust-hero{display:grid;grid-template-columns:1.1fr 0.9fr;gap:40px;padding:40px 56px 0;align-items:center;height:calc(100% - 64px)}
.trust-hero h1{font:400 46px/1.12 var(--font-display);letter-spacing:-0.8px;margin:18px 0 14px}
.trust-hero p{font:var(--text-body-md);color:var(--color-body);max-width:420px;margin:0 0 26px}
.cta-row{display:flex;gap:14px}
.cta-row.center{justify-content:center}
.trust-row{display:flex;gap:36px;margin-top:36px}
.trust-num{font:600 22px var(--font-mono);color:var(--color-ink)}
.trust-label{font:var(--text-caption);color:var(--color-muted);margin-top:2px}
.donut-wrap{position:relative;width:140px;height:140px;margin:18px 0}
.donut{width:100%;height:100%;border-radius:50%}
.donut-center{position:absolute;inset:22px;border-radius:50%;background:var(--color-canvas);display:flex;align-items:center;justify-content:center;text-align:center;font:var(--text-caption-strong);color:var(--color-muted)}
.dark-card .donut-center{background:var(--color-surface-dark-elevated);color:var(--color-on-dark-soft)}
.legend{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.legend-item{display:flex;justify-content:space-between;align-items:center;font:var(--text-caption);gap:16px}
.legend-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:8px}

/* BOLD landing */
.bold-hero{padding:0;display:flex;flex-direction:column}
.bold-center{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;padding:20px 32px 24px;justify-content:center}
.bold-h1{font:400 44px/1.12 var(--font-display);letter-spacing:-1px;margin:16px 0 12px}
.bold-h1 .accent{color:var(--color-primary)}
.bold-sub{font:var(--text-body-md);color:var(--color-on-dark-soft);max-width:520px;margin:0 0 20px}
.glow-card-wrap{position:relative;margin-top:20px}
.glow{position:absolute;inset:-40px;background:radial-gradient(circle,rgba(28,78,216,0.35),transparent 70%);filter:blur(10px);z-index:0}
.glow-card-wrap .card{position:relative;z-index:1;width:400px;text-align:left}
.sparkline-wrap{margin-top:14px}

/* TERMINAL landing */
.term-hero{padding:0;display:flex;flex-direction:column}
.mono-nav .navlinks{font-family:var(--font-mono);text-transform:uppercase;font-size:12px;letter-spacing:.04em}
.term-grid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:32px;padding:36px 48px;align-items:center}
.term-h1{font:400 42px/1.16 var(--font-display);letter-spacing:-0.6px;margin:16px 0 12px}
.term-sub{font:var(--text-body-md);color:var(--color-on-dark-soft);max-width:400px;margin:0 0 24px}
.term-stats-row{display:flex;gap:24px;margin-top:28px;font:var(--text-caption);color:var(--color-on-dark-soft)}
.mono-card{padding:20px}
.term-card-head{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:12px;color:var(--color-on-dark-soft);margin-bottom:8px}
.term-total{color:#fff;font-size:16px}
.term-list{margin-top:14px;display:flex;flex-direction:column;gap:0}
.term-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.08);font-family:var(--font-mono);font-size:12px}
.term-row span:first-child{color:var(--color-on-dark-soft);font-family:var(--font-body)}

/* DASHBOARDS shared */
.dash-shell{display:flex;height:100%}
.dash-main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.dash-topbar{height:64px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--color-hairline)}
.dash-body{flex:1;padding:24px 28px;overflow:hidden}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
.stat-card{background:var(--color-canvas);border:1px solid var(--color-hairline);border-radius:var(--radius-xl);padding:18px 20px}
.stat-card .label{position:static;font:var(--text-caption);color:var(--color-muted);margin-bottom:6px}
.stat-card .val{font:600 22px var(--font-mono)}
.two-col{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px}
.trend-card,.cat-card{background:var(--color-canvas);border:1px solid var(--color-hairline);border-radius:var(--radius-xl);padding:20px}
.trend-card .title,.cat-card .title{font:var(--text-title-sm);margin-bottom:14px}
.txn-card{background:var(--color-canvas);border:1px solid var(--color-hairline);border-radius:var(--radius-xl);padding:8px 20px}
.txn-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--color-hairline-soft);font:var(--text-body-sm)}
.txn-row:last-child{border-bottom:none}
.chip-row{display:flex;gap:8px;margin-bottom:16px}
.chip{background:var(--color-surface-strong);color:var(--color-ink);border-radius:var(--radius-pill);padding:6px 14px;font:var(--text-caption-strong)}
.chip.active{background:var(--color-ink);color:#fff}

/* Shell variant */
.sidebar{width:220px;background:var(--color-surface-dark);color:var(--color-on-dark);padding:22px 14px;display:flex;flex-direction:column;gap:2px;flex-shrink:0}
.sidebar .wordmark{padding:0 10px 20px;color:#fff}
.sidebar-item{padding:10px 12px;border-radius:8px;font:var(--text-body-sm);color:var(--color-on-dark-soft);cursor:default}
.sidebar-item.active{background:rgba(255,255,255,0.08);color:#fff}
.sidebar-upsell{margin-top:auto;background:var(--color-primary);border-radius:var(--radius-md);padding:14px;font:var(--text-caption);color:#fff}
.sidebar-upsell button{margin-top:10px;width:100%;background:#fff;color:var(--color-primary);border:none;border-radius:var(--radius-pill);padding:8px;font:600 13px var(--font-body);cursor:pointer}

/* Terminal dash variant */
.term-dash{background:var(--color-surface-dark);color:var(--color-on-dark);height:100%;padding:20px 24px;overflow:hidden}
.term-dash-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-family:var(--font-mono);font-size:13px;color:var(--color-on-dark-soft)}
.term-dash-top .big{color:#fff;font-size:20px}
.term-dash-grid{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:18px;height:calc(100% - 50px)}
.term-panel{background:var(--color-surface-dark-elevated);border-radius:var(--radius-lg);padding:16px}
.term-panel .title{font:600 11px var(--font-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--color-on-dark-soft);margin-bottom:12px}
.mini-row{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:11px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.06)}
</style>
</head>
<body>
<script>
const D = window.FINSIGHT_DATA;
const CH = window.FinsightCharts;
const PALETTE = ['var(--color-primary)','var(--color-ink)','var(--color-accent-warm)','var(--color-semantic-up)','var(--color-muted)','var(--color-muted-soft)','var(--color-hairline)'];
const CATS = D.categories.slice().sort((a,b)=>b.amount-a.amount);
const TREND = D.monthly.map(m=>m.total);
const TOTAL = D.won(CATS.reduce((s,c)=>s+c.amount,0));

const FRAMES = [
  { id:'landing-trust', label:'랜딩 · 신뢰형', w:1200, h:640 },
  { id:'landing-bold', label:'랜딩 · 볼드형', w:1200, h:640 },
  { id:'landing-terminal', label:'랜딩 · 터미널형', w:1200, h:640 },
  { id:'dash-airy', label:'대시보드 · 에어리', w:1200, h:800 },
  { id:'dash-shell', label:'대시보드 · 앱 셀', w:1200, h:800 },
  { id:'dash-terminal', label:'대시보드 · 터미널', w:1200, h:800 },
];
const GAP_X = 60, GAP_Y = 70;
let x = 0;
FRAMES.slice(0,3).forEach(f=>{ f.x = x; f.y = 0; x += f.w + GAP_X; });
x = 0;
const row2y = FRAMES[0].h + GAP_Y + 30;
FRAMES.slice(3,6).forEach(f=>{ f.x = x; f.y = row2y; x += f.w + GAP_X; });

FRAMES.forEach(f=>{
  const lbl = document.createElement('div');
  lbl.className = 'label'; lbl.style.left = f.x+'px'; lbl.style.top = (f.y-26)+'px'; lbl.textContent = f.label;
  document.body.appendChild(lbl);
  const box = document.createElement('div');
  box.style.position = 'absolute'; box.style.left = f.x+'px'; box.style.top = f.y+'px'; box.style.width = f.w+'px'; box.style.height = f.h+'px';
  box.innerHTML = '<div class="frame-inner" id="'+f.id+'"></div>';
  document.body.appendChild(box);
});

function drawLine(svgId, values, color){
  const svg = document.getElementById(svgId);
  if(!svg) return;
  const vb = svg.getAttribute('viewBox').split(' ').map(Number);
  const w = vb[2], h = vb[3];
  const area = CH.areaPath(values, w, h, 6);
  const pts = CH.linePoints(values, w, h, 6);
  svg.innerHTML = '<path d="'+area+'" fill="'+color+'" opacity="0.12"></path><polyline points="'+pts.join(' ')+'" fill="none" stroke="'+color+'" stroke-width="2.5"></polyline>';
}
drawLine('svg-bold', TREND, '#7fa2ff');
drawLine('svg-term', TREND, '#7fa2ff');
drawLine('svg-airy', TREND, getComputedStyle(document.body).getPropertyValue('--color-primary').trim() || '#1C4ED8');
drawLine('svg-shell', TREND, '#1C4ED8');
drawLine('svg-termdash', TREND, '#7fa2ff');
</script>
